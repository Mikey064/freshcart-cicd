name: Freshcart CI

on:
    pull_request:
        branches: [main]

jobs:
    build-and-typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                node-version: '24.x'
                cache: 'npm'
                cache-dependency-path: 'checkout-api/package-lock.json'

            - run: npm ci
            - run: npm run build --if-present
            - run: npm run typecheck --if-present